name: Review Orchestrator — Watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  checks: read
  statuses: read
  deployments: read
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  scan-factory-pull-requests:
    name: Retry or stall missing exact-head reviews
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run review watchdog
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_APPROVED_AUTHOR: ${{ github.repository_owner }}
        run: |
          source .github/scripts/review-orchestrator-common.sh
          process_review_orchestrator_watchdog
