<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Hướng dẫn sourcing và phát triển sản phẩm."><title>Bài viết sourcing | Vietnam Clothing</title><link rel="stylesheet" href="../vnc-system.css"><link rel="stylesheet" href="../editorial.css"></head><body><header class="site-header"><div class="shell header-row"><a class="brand" href="./index.html"><span class="brand-mark">V</span><span>VIETNAM CLOTHING<small>MERCHANDISE & SOURCING</small></span></a><button class="menu-toggle" aria-controls="navigation" aria-expanded="false" aria-label="Mở menu">☰ Menu</button><nav id="navigation" class="nav-links" aria-label="Điều hướng"><a href="./solutions.html">Giải pháp</a><a href="./catalog.html">Danh mục</a><a href="./insights.html">Kiến thức</a><a class="pill" href="./contact.html">Gửi yêu cầu ↗</a></nav></div></header><main><section class="minor-hero"><div class="shell"><span class="eyebrow"><a href="./insights.html">Kiến thức</a> / Bài viết</span><h1 id="article-title">Đang tải bài viết</h1><p id="article-summary"></p></div></section><section class="section"><div class="shell"><div class="editorial-article" id="article-content"></div><div class="actions"><a href="./insights.html" class="pill secondary">← Xem bài viết khác</a><a href="./contact.html" class="pill">Gửi brief ↗</a></div></div></section><script id="editorial-data" type="application/json">[{"slug":"artist-merchandise-planning","title":"Lập kế hoạch bộ merchandise cho nghệ sĩ","category":"Entertainment","image":"demo-artist-tour-tee.svg","summary":"Xác định sản phẩm, quyền sử dụng hình ảnh, quy trình duyệt mẫu và lịch tour.","sections":[["Bắt đầu với người mua và kênh phân phối","Xác định bán tại concert, bán online, cộng đồng người hâm mộ hay dùng cho chiến dịch. Điều này ảnh hưởng đến chủng loại, size, bao bì và giao nhận."],["Xác minh bản quyền","Làm rõ quyền sử dụng tên nghệ sĩ, hình ảnh, artwork và nhãn hiệu, cùng người có thẩm quyền phê duyệt."],["Xây dựng danh sách mã hàng","Quản lý từng SKU, biến thể, vật liệu, số lượng và yêu cầu đóng gói."],["Duyệt mẫu chuẩn","Thống nhất vị trí in, màu sắc, chất liệu, kích thước và mức chấp nhận chất lượng."],["Lập kế hoạch ngược từ lịch sự kiện","Dự trù thời gian mẫu, chỉnh sửa, sản xuất, đóng gói và vận chuyển."]]},{"slug":"promotional-kit-brief","title":"Cách lập brief cho bộ quà tặng quảng bá","category":"Brand Merchandise","image":"demo-campaign-kit.svg","summary":"Phối hợp sản phẩm, vật liệu, ngân sách và lịch chiến dịch.","sections":[["Xác định mục tiêu chiến dịch","Làm rõ đối tượng, hoàn cảnh nhận quà và tác động mong muốn."],["Tính đủ ngân sách","Tổng hợp hàng hóa, gia công trang trí, bao bì, đóng bộ và vận chuyển."],["Lựa chọn sản phẩm","Chọn các vật phẩm phù hợp để người nhận sử dụng được."],["Chuẩn bị bộ nhận diện","Cung cấp logo, file artwork, màu sắc, vị trí in và các tiêu chuẩn liên quan."],["Kiểm tra lịch giao hàng","Xác nhận số lượng, địa điểm và mốc thời gian trước khi chốt."]]},{"slug":"apparel-techpack-checklist","title":"Từ tech pack đến mẫu may được duyệt","category":"Apparel OEM","image":"demo-private-label-hoodie.svg","summary":"Các bước mô tả rập, chất liệu, phụ liệu, in thêu và quy trình duyệt mẫu.","sections":[["Mô tả chính xác sản phẩm","Gửi form dáng, chất liệu, định lượng, bảng thông số và dung sai."],["Chi tiết kỹ thuật may","Làm rõ đường may, bo, phụ liệu, nhãn và đóng gói."],["Trang trí và hoàn thiện","Xác định vị trí, kích thước artwork, màu và phương án wash khi cần."],["Duyệt mẫu có hệ thống","So sánh mẫu với bảng thông số và ghi nhận các điểm cần sửa."],["Xác nhận điều kiện thương mại","Báo giá, MOQ và tiến độ dựa trên thông số và số lượng đã được xác nhận."]]}]</script><script src="../editorial.js" defer></script></main><footer class="site-footer"><div class="shell"><div class="footer-grid"><div><strong>VIETNAM CLOTHING</strong><p>Đối tác mer
